<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <title>Spotifion</title>
    <script>
      // Restore the last theme's colors before first paint (src/lib/theme.ts
      // caches them; it re-applies the saved theme once the app loads).
      try {
        var cached = JSON.parse(localStorage.getItem("spotifion.theme.css") || "null");
        if (cached) {
          for (var name in cached.vars) document.documentElement.style.setProperty(name, cached.vars[name]);
          document.documentElement.style.colorScheme = cached.scheme;
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-spotify-base-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
