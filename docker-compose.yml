services:
  spotifion:
    # Swap for ghcr.io/<your-github-username>/spotifion:latest once CI has
    # pushed an image; "build:" is handy for local testing in the meantime.
    build: .
    image: ghcr.io/astri4-4/spotifiak:latest
    container_name: spotifion
    restart: unless-stopped
    environment:
      # Must be reachable from *inside* this container (it's never exposed
      # to the browser directly - nginx proxies /rest/ to it server-side).
      NAVIDROME_URL: ${NAVIDROME_URL:-https://navidrome.sachaguerin.fr}
      # Optional: deemix, for Discover (download music into the library). Only
      # this container talks to it, so it can stay on your home network.
      DEEMIX_URL: ${DEEMIX_URL:-}
      # Optional: "Remove duplicates" needs the music folder, read-write, at
      # MUSIC_DIR (uncomment the volume below), and Navidrome reporting real
      # file paths (ND_SUBSONIC_DEFAULTREPORTREALPATH=true on Navidrome).
      # MUSIC_DIR: /music
      # DEEMIX_FOLDER: Deezer   # deemix's download folder within it, if a subfolder
    volumes:
      # Keeps settings changed from the app (the deemix server) across restarts.
      - spotifion-data:/opt/jam/data
      # - /path/to/your/music:/music
    ports:
      - "8080:8080"
    # If you're fronting this with Traefik/Caddy/nginx-proxy instead of the
    # ports mapping above, drop the ports block and add your proxy's labels
    # here, pointing at container port 8080.

volumes:
  spotifion-data:
