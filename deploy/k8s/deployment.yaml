apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotifion
  labels:
    app.kubernetes.io/name: spotifion
spec:
  # Jam sessions live in the Jam server's memory, so there must be exactly
  # one pod: with more, a guest could land on a pod that doesn't know the
  # host's Jam. Recreate avoids two pods briefly splitting new Jams during a
  # rollout (running Jams end on redeploy either way).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spotifion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spotifion
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # Makes the data volume (a fresh Longhorn disk, owned by root)
        # writable for uid 101. The SMB music share is untouched: the SMB
        # CSI driver only applies fsGroup to ReadWriteOnce volumes.
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spotifion
          image: ghcr.io/astri4-4/spotifiak:latest
          imagePullPolicy: Always
          env:
            - name: NAVIDROME_URL
              value: https://navidrome.sachaguerin.fr
            # Discover: the deemix server to download through (empty turns
            # it off), as reachable from this pod: in the cluster, its
            # Service's name (home-network DNS names don't resolve here).
            # One set from the app's Settings overrides it (saved in the
            # data volume).
            - name: DEEMIX_URL
              value: http://deemix.media.svc.cluster.local:6595
            # Remove duplicates: the music share, read-write (music-volume.yaml).
            # Navidrome must report real file paths for it:
            # ND_SUBSONIC_DEFAULTREPORTREALPATH=true on Navidrome.
            - name: MUSIC_DIR
              value: /music
            # deemix's download folder within it (deemix mounts that subPath).
            - name: DEEMIX_FOLDER
              value: Deezer
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /jam-api/healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            # nginx only: the Jam server is already restarted in-container
            # by docker/40-start-jam-server.sh if it crashes.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Writable paths nginx needs with a read-only root filesystem:
          # the rendered config (envsubst at startup), pid file and temp dirs;
          # and the Jam server's saved data (JAM_DATA_DIR, data-volume.yaml).
          volumeMounts:
            - name: data
              mountPath: /opt/jam/data
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: music
              mountPath: /music
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: spotifion-data
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: music
          persistentVolumeClaim:
            claimName: music
