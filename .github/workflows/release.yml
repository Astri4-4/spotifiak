name: Release

# Pushing a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`)
# builds the desktop app on each OS and publishes a GitHub Release with the
# installers attached. The app version comes from the tag, not package.json.
#
# It can also be run by hand on any branch (Actions -> Release -> Run
# workflow) to check the builds; that uploads the files as workflow artifacts
# but publishes nothing.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac
            files: release/*.dmg
          - name: Windows
            os: windows-latest
            args: --win
            files: release/*.exe
          - name: Linux
            os: ubuntu-latest
            args: --linux
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm run build

      # Signed only if signing secrets are configured: electron-builder picks
      # up CSC_LINK/CSC_KEY_PASSWORD (macOS/Windows certificate) and
      # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID (notarization).
      # Without a certificate the macOS app is ad-hoc signed instead: an
      # unsigned build has a broken signature, which Apple Silicon Macs
      # report as "Spotifiak is damaged".
      - name: Package
        shell: bash
        run: |
          # Unconfigured secrets arrive as empty strings, which electron-builder
          # treats as set (an empty CSC_LINK resolves to the working directory).
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [[ -z "${!var}" ]] && unset "$var"
          done
          args=(${{ matrix.args }} --publish never)
          if [[ "$RUNNER_OS" == "macOS" && -z "$CSC_LINK" ]]; then
            args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          npx electron-builder "${args[@]}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
